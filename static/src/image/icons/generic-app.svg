<!--
    Last-resort placeholder: an app we have no artwork for and that Odoo
    handed us no icon for either (a module shipping no
    static/description/icon.png). Deliberately neutral, so it never reads
    as another app's icon.

    Drawn as an isometric cube — the generic "a module" mark — rather than
    imported as the source PNG: the sidebar paints bundled artwork through
    a CSS mask, so only the alpha channel survives, and a crop with its
    background baked in would mask down to a solid rectangle. As geometry
    it also stays crisp at the rail's 18px and follows the resting /
    hover / current-app colours like every other bundled icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="#1AD3BB" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.8 20.2 7.5v9L12 21.2 3.8 16.5v-9z"/>
    <path d="M3.8 7.5 12 12.2l8.2-4.7"/>
    <path d="M12 12.2v9"/>
</svg>
